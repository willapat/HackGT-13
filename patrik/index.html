<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tiny Town Sandbox</title>
  <style>
    :root {
      --panel: rgba(255, 255, 255, 0.88);
      --ink: #1f2430;
      --muted: #667085;
      --line: rgba(31, 36, 48, 0.1);
      --accent: #3b6fe0;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #9fd3ec; color: var(--ink);
      font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #game { position: fixed; inset: 0; }

    .panel { position: fixed; background: var(--panel); backdrop-filter: blur(8px); border-radius: 14px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.12); }
    h2 { margin: 0 0 8px; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }

    #side { top: 16px; left: 16px; width: 290px; max-height: calc(100% - 32px); padding: 14px; display: flex;
      flex-direction: column; gap: 14px; }
    #side .title { font-size: 20px; font-weight: 700; }
    #side .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
    #residents { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
    #residents li { display: flex; gap: 8px; align-items: flex-start; }
    .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; flex: none; }
    .status { color: var(--muted); font-size: 12px; }
    #feed { list-style: none; margin: 0; padding: 0; overflow-y: auto; min-height: 0; flex: 1; display: grid;
      gap: 4px; align-content: start; font-size: 12.5px; }
    #feed li { padding: 4px 0; border-top: 1px solid var(--line); }
    #feed time { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 6px; }
    .feedwrap { display: flex; flex-direction: column; min-height: 0; flex: 1; }

    #triggers { top: 16px; right: 16px; padding: 12px; width: 250px; display: grid; gap: 6px; }
    #triggers button, .card button { font: inherit; border: 1px solid var(--line); background: #fff; color: var(--ink);
      border-radius: 9px; padding: 7px 10px; text-align: left; cursor: pointer; }
    #triggers button:hover, .card button:hover { border-color: var(--accent); }
    #triggers .note { color: var(--muted); font-size: 11.5px; }

    #cards { position: fixed; right: 16px; bottom: 16px; width: 320px; display: grid; gap: 10px; }
    .card { padding: 14px; border-left: 4px solid var(--accent); animation: pop 0.35s ease-out; position: static; }
    .card .kind { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
    .card .text { margin: 4px 0 10px; }
    .card .row { display: flex; gap: 6px; flex-wrap: wrap; }
    .card button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    @keyframes pop { from { transform: translateY(12px); opacity: 0; } }

    #hint { left: 50%; bottom: 16px; transform: translateX(-50%); padding: 6px 12px; font-size: 12px; color: var(--muted); }

    @media (max-width: 800px) {
      #side { width: calc(100% - 32px); max-height: 38%; }
      #triggers { top: auto; bottom: 16px; left: 16px; right: 16px; width: auto; }
      #cards { width: calc(100% - 32px); bottom: 190px; }
      #hint { display: none; }
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <aside id="side" class="panel">
    <div>
      <div class="title">Tiny Town</div>
      <div class="sub">Phaser 3 + Kenney isometric tiles: rendering sandbox</div>
    </div>
    <div>
      <h2>Residents</h2>
      <ul id="residents"></ul>
    </div>
    <div class="feedwrap">
      <h2>Town feed</h2>
      <ul id="feed"></ul>
    </div>
  </aside>

  <section id="triggers" class="panel">
    <h2>Demo signals</h2>
    <button data-trigger="goodNews">🎉 Maya shares good news</button>
    <button data-trigger="climbing">🧗 Sam &amp; Priya both mention climbing</button>
    <button data-trigger="roughWeek">🌧️ Jordan is having a rough week</button>
    <button data-trigger="reset">↺ Reset town</button>
    <div class="note">Buttons call the town backend (3s timeout), then fall back to the scripted demo if it is down.</div>
  </section>

  <div id="cards"></div>
  <div id="hint" class="panel">Drag to pan · scroll to zoom · click a resident</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="lib/phaser.min.js"></script>
  <script src="src/config.js"></script>
  <script src="src/realtime.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
