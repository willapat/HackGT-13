# Deploys the web app (frontend/ + town/) to Vercel production on every push to main.
# Vercel's Hobby plan blocks Git deploys of teammates' commits on a private repo, so this deploys with the
# owner's token instead (repo secret VERCEL_TOKEN, from vercel.com/account/tokens). vercel.json turns off Vercel's own Git deploys.
name: Deploy web to Vercel

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "town/**"
      - "vercel.json"
      - ".vercelignore"
  workflow_dispatch:

concurrency:
  group: vercel-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_RyIp4T5B1FJUZepPVySWDJ9y
      VERCEL_PROJECT_ID: prj_5aBilFPrp7SiXgTWAZgIAHnC2zbU
    steps:
      - uses: actions/checkout@v4
      - run: npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
