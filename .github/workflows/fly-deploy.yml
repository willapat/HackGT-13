# Deploys the backend to Fly.io on every push to main that touches it (the frontend deploys through Vercel's Git integration).
# Needs the repo secret FLY_API_TOKEN (`fly tokens create deploy`).
name: Deploy backend to Fly

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "requirements.txt"
      - "Dockerfile"
      - ".dockerignore"
      - "fly.toml"
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
